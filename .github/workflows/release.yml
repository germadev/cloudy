name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versión
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Dos releases a la vez calcularían la misma versión.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Calcular versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Incrementar versión
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Última versión publicada: la etiqueta vX.Y.Z más alta (0.0.0 si no hay).
          previous="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          current="${previous#v}"
          current="${current:-0.0.0}"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Tipo de versión no válido: $BUMP"; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::La etiqueta v$version ya existe."
            exit 1
          fi
          echo "Versión: ${previous:-ninguna} -> v$version ($BUMP)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    name: Publicar release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cloudy-*
          path: dist
          merge-multiple: true

      # La etiqueta se crea aquí, sobre el commit compilado, solo si las
      # builds han terminado bien.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
